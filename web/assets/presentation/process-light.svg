400">fingerprint</text><text x="530.0" y="259.0" fill="#557a81" font-size="17" text-anchor="start" font-weight="400">Source mutation</text><text x="530.0" y="282.8" fill="#557a81" font-size="17" text-anchor="start" font-weight="400">detected</text><rect x="746.0" y="176" width="210.0" height="122" rx="12" fill="#f7fefc" stroke="#cbf7ef"/><text x="764.0" y="207.0" fill="#132a2c" font-size="21" text-anchor="start" font-weight="400">04  Mark old</text><text x="764.0" y="236.4" fill="#132a2c" font-size="21" text-anchor="start" font-weight="400">facts</text><text x="764.0" y="259.0" fill="#557a81" font-size="17" text-anchor="start" font-weight="400">Both stale; diff</text><text x="764.0" y="282.8" fill="#557a81" font-size="17" text-anchor="start" font-weight="400">retained</text><text x="44" y="379.0" fill="#577c68" font-size="20" text-anchor="start" font-weight="400">Real file and SQLite operations; no screen or model access.</text></svg>
