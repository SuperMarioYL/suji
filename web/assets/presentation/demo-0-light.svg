<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" data-palette="56e6cc-6abbe7-acf6cd-6070df6b75fb" role="img" aria-labelledby="demo-0-light-title demo-0-light-desc"><title id="demo-0-light-title">SuJi demo 1</title><desc id="demo-0-light-desc">Constructed text contains two facts: twelve tasks and version 1.0. After changing the task count to fifteen, the real FileFetcher rereads the source and Cascade marks both old facts stale, retaining a diff with 12/15. The unchanged version fact also becomes stale because the current rule operates on the whole-source fingerprint.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="760" y2="330"><stop stop-color="#308072"/><stop offset=".6" stop-color="#457a97"/><stop offset="1" stop-color="#577c68"/></linearGradient><radialGradient id="halo"><stop stop-color="#308072" stop-opacity=".22"/><stop offset="1" stop-color="#f9fefd" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbf7ef" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#308072" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="760" height="330" rx="16" fill="#f9fefd"/><rect width="760" height="330" rx="16" f