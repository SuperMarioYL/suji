<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：AX 抓取 → 本地 Qwen3 抽取 → SQLite 溯源库 → 级联失效；CLI 回溯查询">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static connectors (under the marching dashes) -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="206" y1="170" x2="262" y2="170" marker-end="url(#ah-l)"/>
    <line x1="412" y1="170" x2="468" y2="170" marker-end="url(#ah-l)"/>
    <line x1="618" y1="170" x2="674" y2="170" marker-end="url(#ah-l)"/>
    <line x1="543" y1="208" x2="543" y2="268" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching-dash data flow (direction = data direction) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="206" y1="170" x2="256" y2="170" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="412" y1="170" x2="462" y2="170" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="618" y1="170" x2="668" y2="170" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- packet dots flowing along the connectors -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M206,170 L256,170" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M412,170 L462,170" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M618,170 L668,170" dur="2.4s" begin="-2.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-2.0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes (breathing fill-opacity, staggered negative begin) -->
  <g>
    <!-- capture : blue / input -->
    <rect x="56" y="132" width="150" height="76" rx="14" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="131" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">AX 抓取</text>
    <text x="131" y="184" text-anchor="middle" font-size="11" fill="#6E6E73">公众号·钉钉·WPS</text>

    <!-- qwen : purple / agent -->
    <rect x="262" y="132" width="150" height="76" rx="14" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="337" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">本地 Qwen3</text>
    <text x="337" y="184" text-anchor="middle" font-size="11" fill="#6E6E73">事实抽取</text>

    <!-- store : green / persisted memory -->
    <rect x="468" y="132" width="150" height="76" rx="14" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="543" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">SQLite 溯源库</text>
    <text x="543" y="184" text-anchor="middle" font-size="11" fill="#6E6E73">事实+来源+指纹</text>

    <!-- cascade : purple / the moat -->
    <rect x="674" y="132" width="150" height="76" rx="14" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="749" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">级联失效</text>
    <text x="749" y="184" text-anchor="middle" font-size="11" fill="#6E6E73">来源变更→stale</text>

    <!-- CLI : blue / user surface -->
    <rect x="468" y="268" width="150" height="64" rx="14" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
    <text x="543" y="294" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">CLI</text>
    <text x="543" y="314" text-anchor="middle" font-size="11" fill="#6E6E73">ask / stale / sources</text>
  </g>
</svg>
